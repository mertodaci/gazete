services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gazete
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gazete
    volumes:
      - gazete_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gazete -d gazete"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: ["npm", "run", "prisma:deploy", "--workspace=@gazete/db"]
    environment:
      DATABASE_URL: postgresql://gazete:${POSTGRES_PASSWORD}@postgres:5432/gazete
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      # Host port 3010, not 3000 — port 3000 is already taken by another
      # app on this VPS (Sakin, run via PM2). The container's own internal
      # port stays 3000 (Next.js's default); only the host-side mapping
      # differs, so nginx must proxy_pass to 127.0.0.1:3010.
      - "127.0.0.1:3010:3000"
    environment:
      DATABASE_URL: postgresql://gazete:${POSTGRES_PASSWORD}@postgres:5432/gazete
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
      FROM_EMAIL: ${FROM_EMAIL}
      BASE_URL: ${BASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://gazete:${POSTGRES_PASSWORD}@postgres:5432/gazete
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      BASE_URL: ${BASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  gazete_pg_data:
